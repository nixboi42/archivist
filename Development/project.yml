name: ArchivistDevelopment
options:
  bundleIdPrefix: com.keremgurevin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ArchivistPackage:
    path: ..
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_VERSION: "6.0"
    ARCHIVIST_FINDER_HANDOFF_MODE: app-group
targets:
  Archivist:
    type: application
    platform: macOS
    sources:
      - path: Packages/App/Sources/ArchivistApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keremgurevin.Archivist
        PRODUCT_NAME: Archivist
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Archivist.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: ArchivistPackage
        product: ArchiveUI
      - package: ArchivistPackage
        product: ProductionComposition
      - target: ArchivistFinderSync
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Prevent development Finder transport in Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ] && [ "${ARCHIVIST_FINDER_HANDOFF_MODE}" = "personal-team-development" ]; then
            echo "error: Personal Team Finder transport is forbidden in Release builds"
            exit 1
          fi
    postBuildScripts:
      - name: Bundle and sign 7zz
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ -z "${ARCHIVIST_7ZZ_PATH:-}" ]; then
            echo "error: ARCHIVIST_7ZZ_PATH must point to the pinned 7-Zip 26.02 7zz executable"
            exit 1
          fi
          if [ ! -f "${ARCHIVIST_7ZZ_PATH}" ] || [ ! -x "${ARCHIVIST_7ZZ_PATH}" ]; then
            echo "error: ARCHIVIST_7ZZ_PATH is not an executable file: ${ARCHIVIST_7ZZ_PATH}"
            exit 1
          fi
          EXPECTED_7ZZ_SHA256="ecf1725c92260f5565d3c549a835407c6be7b8baf0d0dcc3e472599f81a4897a"
          ACTUAL_7ZZ_SHA256="$(shasum -a 256 "${ARCHIVIST_7ZZ_PATH}" | awk '{print $1}')"
          if [ "${ACTUAL_7ZZ_SHA256}" != "${EXPECTED_7ZZ_SHA256}" ]; then
            echo "error: ARCHIVIST_7ZZ_PATH does not match the pinned 7-Zip 26.02 checksum"
            exit 1
          fi
          HELPER_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          HELPER_PATH="${HELPER_DIR}/7zz"
          mkdir -p "${HELPER_DIR}"
          ditto "${ARCHIVIST_7ZZ_PATH}" "${HELPER_PATH}"
          chmod 755 "${HELPER_PATH}"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp=none "${HELPER_PATH}"
          fi
  ArchivistFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: Development/FinderSync
        excludes:
          - Info.plist
          - ArchivistFinderSync.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keremgurevin.Archivist.FinderSync
        PRODUCT_NAME: ArchivistFinderSync
        INFOPLIST_FILE: FinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderSync/ArchivistFinderSync.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: ArchivistPackage
        product: FinderIntegration
      - sdk: FinderSync.framework
schemes:
  Archivist:
    build:
      targets:
        Archivist: all
    run:
      config: Debug
